<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 520" width="1120" height="520" role="img" aria-labelledby="flockTitle flockDesc">
  <title id="flockTitle">Flock topology: one hub schedules tasks onto perches over HTTP, shipping repos and results as git bundles</title>
  <desc id="flockDesc">The hub runs the engine, scheduler, auditor, merger, store and server. It sends a task and a git bundle of the integration branch to each perch. A perch runs a local node with git worktrees and an opencode server, optionally lends its local Ollama model, and returns a result bundle plus agent events over SSE. Discovery is mDNS or a join code; heartbeats run every three seconds and a missing perch is rescheduled.</desc>

  <defs>
    <marker id="arrow2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#6f7b89"/>
    </marker>
    <marker id="arrowTeal" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#2f8f86"/>
    </marker>
    <marker id="arrowViolet" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#8b5cf6"/>
    </marker>
  </defs>

  <g font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" fill="#6f7b89">
    <text x="32" y="50" font-size="24" font-weight="650" fill="#5a6673">The flock spreads across the room</text>
    <text x="32" y="78" font-size="14">One hub owns the run and the repo. Perches lend CPU and opencode sessions. Audit and merge never leave the hub.</text>

    <!-- hub -->
    <rect x="32" y="112" width="380" height="330" rx="16" fill="rgba(47,143,134,0.07)" stroke="#2f8f86" stroke-opacity="0.75" stroke-width="1.6"/>
    <text x="56" y="146" font-size="16" font-weight="700" fill="#2f8f86">HUB · MacBook Pro</text>
    <text x="56" y="166" font-size="12">roost #1 · the source of truth</text>

    <g stroke="#6f7b89" stroke-opacity="0.45" stroke-width="1.2" fill="rgba(127,127,127,0.06)">
      <rect x="56" y="184" width="332" height="48" rx="9"/>
      <rect x="56" y="242" width="332" height="48" rx="9"/>
      <rect x="56" y="300" width="332" height="48" rx="9"/>
      <rect x="56" y="358" width="332" height="48" rx="9"/>
    </g>
    <g font-size="13" font-weight="650" fill="#5a6673">
      <text x="70" y="204">Engine + scheduler</text>
      <text x="70" y="262">Auditor + Merger</text>
      <text x="70" y="320">Store + JSONL event log</text>
      <text x="70" y="378">Server :7777 · REST + SSE</text>
    </g>
    <g font-size="11">
      <text x="70" y="220">picks the node with the most free slots</text>
      <text x="70" y="278">tests · lane check · model verdict</text>
      <text x="70" y="336">every event, replayable offline</text>
      <text x="70" y="394">streams the run to The Sky</text>
    </g>

    <!-- perches -->
    <rect x="700" y="112" width="388" height="146" rx="16" fill="rgba(139,92,246,0.06)" stroke="#8b5cf6" stroke-opacity="0.7" stroke-width="1.6"/>
    <text x="724" y="144" font-size="16" font-weight="700" fill="#8b5cf6">PERCH · MacBook Air</text>
    <text x="724" y="163" font-size="11.5">starling perch --name "M2 Air" --max-sessions 5</text>
    <g stroke="#6f7b89" stroke-opacity="0.4" stroke-width="1.2" fill="rgba(127,127,127,0.06)">
      <rect x="724" y="176" width="340" height="32" rx="8"/>
      <rect x="724" y="214" width="340" height="32" rx="8"/>
    </g>
    <text x="736" y="197" font-size="12" font-weight="600" fill="#5a6673">LocalNode · worktree + opencode serve</text>
    <text x="736" y="235" font-size="12" font-weight="600" fill="#5a6673">Ollama (optional, lendable to the hub)</text>

    <rect x="700" y="296" width="388" height="146" rx="16" fill="rgba(139,92,246,0.06)" stroke="#8b5cf6" stroke-opacity="0.7" stroke-width="1.6"/>
    <text x="724" y="328" font-size="16" font-weight="700" fill="#8b5cf6">PERCH · any laptop</text>
    <text x="724" y="347" font-size="11.5">joins by mDNS, or --hub http://ip:7777 --code XXXX-XXXX</text>
    <g stroke="#6f7b89" stroke-opacity="0.4" stroke-width="1.2" fill="rgba(127,127,127,0.06)">
      <rect x="724" y="360" width="340" height="32" rx="8"/>
      <rect x="724" y="398" width="340" height="32" rx="8"/>
    </g>
    <text x="736" y="381" font-size="12" font-weight="600" fill="#5a6673">5 more session slots, same protocol</text>
    <text x="736" y="419" font-size="12" font-weight="600" fill="#5a6673">loses its lid → task back to ready</text>

    <!-- task out -->
    <path d="M416 170 H694" fill="none" stroke="#2f8f86" stroke-width="1.7" marker-end="url(#arrowTeal)"/>
    <text x="556" y="152" font-size="12" text-anchor="middle" fill="#2f8f86">task + repo bundle</text>
    <text x="556" y="189" font-size="11" text-anchor="middle">StartTaskOptions · git bundle create</text>

    <!-- result back -->
    <path d="M694 248 H422" fill="none" stroke="#8b5cf6" stroke-width="1.7" marker-end="url(#arrowViolet)"/>
    <text x="556" y="232" font-size="12" text-anchor="middle" fill="#8b5cf6">result bundle + AgentEvents</text>
    <text x="556" y="267" font-size="11" text-anchor="middle">commit · diff · changed files · SSE</text>

    <!-- second perch connector -->
    <path d="M414 360 H694" fill="none" stroke="#6f7b89" stroke-width="1.4" stroke-dasharray="4 4" marker-end="url(#arrow2)"/>
    <text x="580" y="351" font-size="11.5" text-anchor="middle">same protocol, N perches</text>

    <!-- discovery spine -->
    <path d="M56 468 H1044" fill="none" stroke="#6f7b89" stroke-width="1.3" stroke-dasharray="2 5"/>
    <text x="550" y="458" font-size="12" text-anchor="middle">mDNS _starling._tcp · join code · heartbeat 3 s · offline after 15 s → task rescheduled · x-flock-token on every call</text>
    <text x="550" y="494" font-size="11.5" text-anchor="middle">The hub's own LocalNode is roost #1, so a single laptop is a flock of one. Perch agents work on their own copy; the hub fetches the bundle and audits it.</text>
  </g>
</svg>
