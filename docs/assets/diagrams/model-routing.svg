<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 520" width="1120" height="520" role="img" aria-labelledby="modelsTitle modelsDesc">
  <title id="modelsTitle">Model routing: planner, worker and resolver on DeepSeek V4.1 Flash via opencode; auditor, summarizer and writer on a local Qwen model</title>
  <desc id="modelsDesc">Six roles on the left. The three build roles go to DeepSeek V4.1 Flash, reached through an opencode server or the DeepSeek API. The three judging and writing roles go to a local Qwen model on Ollama, which can also run on a lending perch. Three profiles switch the routing: deepseek is the default, opencode needs no API key, and local sends every role to Ollama.</desc>

  <defs>
    <marker id="arrow3" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#6f7b89"/>
    </marker>
    <marker id="arrowDeepseek" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#2f8f86"/>
    </marker>
    <marker id="arrowLocal" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#c2740c"/>
    </marker>
  </defs>

  <g font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" fill="#6f7b89">
    <text x="32" y="50" font-size="24" font-weight="650" fill="#5a6673">Who thinks where</text>
    <text x="32" y="78" font-size="14">Hard reasoning goes to DeepSeek V4.1 Flash. High-volume judging stays on this laptop with Qwen.</text>

    <!-- roles -->
    <g font-size="12" font-weight="650" fill="#5a6673">
      <rect x="32" y="118" width="230" height="38" rx="8" fill="rgba(47,143,134,0.08)" stroke="#2f8f86" stroke-opacity="0.55" stroke-width="1.2"/>
      <text x="46" y="142">planner</text>
      <rect x="32" y="164" width="230" height="38" rx="8" fill="rgba(47,143,134,0.08)" stroke="#2f8f86" stroke-opacity="0.55" stroke-width="1.2"/>
      <text x="46" y="188">worker</text>
      <rect x="32" y="210" width="230" height="38" rx="8" fill="rgba(47,143,134,0.08)" stroke="#2f8f86" stroke-opacity="0.55" stroke-width="1.2"/>
      <text x="46" y="234">resolver</text>

      <rect x="32" y="286" width="230" height="38" rx="8" fill="rgba(194,116,12,0.09)" stroke="#c2740c" stroke-opacity="0.6" stroke-width="1.2"/>
      <text x="46" y="310">auditor</text>
      <rect x="32" y="332" width="230" height="38" rx="8" fill="rgba(194,116,12,0.09)" stroke="#c2740c" stroke-opacity="0.6" stroke-width="1.2"/>
      <text x="46" y="356">summarizer</text>
      <rect x="32" y="378" width="230" height="38" rx="8" fill="rgba(194,116,12,0.09)" stroke="#c2740c" stroke-opacity="0.6" stroke-width="1.2"/>
      <text x="46" y="402">writer</text>
    </g>
    <g font-size="10.5" text-anchor="end">
      <text x="250" y="141">API</text>
      <text x="250" y="187">API</text>
      <text x="250" y="233">API</text>
      <text x="250" y="309" fill="#c2740c">LOCAL</text>
      <text x="250" y="355" fill="#c2740c">LOCAL</text>
      <text x="250" y="401" fill="#c2740c">LOCAL</text>
    </g>

    <!-- connectors roles -> models -->
    <g fill="none" stroke-width="1.4">
      <path d="M262 137 C306 137 306 158 340 158" stroke="#2f8f86" stroke-opacity="0.8"/>
      <path d="M262 183 H340" stroke="#2f8f86" stroke-opacity="0.8"/>
      <path d="M262 229 C306 229 306 210 340 210" stroke="#2f8f86" stroke-opacity="0.8"/>
      <path d="M262 305 C306 305 306 326 340 326" stroke="#c2740c" stroke-opacity="0.8"/>
      <path d="M262 351 H340" stroke="#c2740c" stroke-opacity="0.8"/>
      <path d="M262 397 C306 397 306 378 340 378" stroke="#c2740c" stroke-opacity="0.8"/>
    </g>

    <!-- model boxes -->
    <rect x="344" y="118" width="300" height="132" rx="14" fill="rgba(47,143,134,0.09)" stroke="#2f8f86" stroke-opacity="0.8" stroke-width="1.6"/>
    <text x="364" y="146" font-size="16" font-weight="700" fill="#2f8f86">DeepSeek V4.1 Flash</text>
    <text x="364" y="166" font-size="11.5">open weights · MIT · 1M context</text>
    <text x="364" y="194" font-size="12.5" fill="#5a6673">Plans the DAG, writes the code,</text>
    <text x="364" y="212" font-size="12.5" fill="#5a6673">fixes merge conflicts.</text>
    <text x="364" y="236" font-size="11">The expensive, high-judgment tokens.</text>

    <rect x="344" y="286" width="300" height="132" rx="14" fill="rgba(194,116,12,0.09)" stroke="#c2740c" stroke-opacity="0.8" stroke-width="1.6"/>
    <text x="364" y="314" font-size="16" font-weight="700" fill="#c2740c">Qwen, on Ollama</text>
    <text x="364" y="334" font-size="11.5">open weights · Apache-2.0 · local</text>
    <text x="364" y="362" font-size="12.5" fill="#5a6673">Audits every diff, maps the repo,</text>
    <text x="364" y="380" font-size="12.5" fill="#5a6673">writes summaries and PR text.</text>
    <text x="364" y="404" font-size="11">~17 tok/s measured on an M5 Pro.</text>

    <!-- connectors models -> transports -->
    <path d="M644 170 H740" fill="none" stroke="#2f8f86" stroke-width="1.7" marker-end="url(#arrowDeepseek)"/>
    <path d="M644 202 H740" fill="none" stroke="#2f8f86" stroke-width="1.7" marker-end="url(#arrowDeepseek)"/>
    <path d="M644 338 H740" fill="none" stroke="#c2740c" stroke-width="1.7" marker-end="url(#arrowLocal)"/>
    <path d="M644 370 H740" fill="none" stroke="#c2740c" stroke-width="1.7" marker-end="url(#arrowLocal)"/>

    <!-- transport boxes -->
    <rect x="744" y="118" width="344" height="132" rx="14" fill="rgba(127,127,127,0.06)" stroke="#6f7b89" stroke-opacity="0.55" stroke-width="1.5"/>
    <text x="764" y="146" font-size="15" font-weight="700" fill="#5a6673">opencode serve → provider</text>
    <text x="764" y="168" font-size="12">The provider you are already logged into.</text>
    <text x="764" y="192" font-size="12">opencode-go/deepseek-v4.1-flash needs</text>
    <text x="764" y="210" font-size="12">no API key. Or point at api.deepseek.com</text>
    <text x="764" y="228" font-size="12">with DEEPSEEK_API_KEY.</text>

    <rect x="744" y="286" width="344" height="132" rx="14" fill="rgba(127,127,127,0.06)" stroke="#6f7b89" stroke-opacity="0.55" stroke-width="1.5"/>
    <text x="764" y="314" font-size="15" font-weight="700" fill="#5a6673">Ollama · 127.0.0.1:11434/v1</text>
    <text x="764" y="336" font-size="12">OpenAI-compatible, no token leaves</text>
    <text x="764" y="354" font-size="12">the machine. A perch can lend its</text>
    <text x="764" y="372" font-size="12">model to the hub for audits.</text>
    <text x="764" y="398" font-size="11">Zero marginal cost; counted as a local call.</text>

    <!-- profiles -->
    <g font-size="11.5">
      <rect x="32" y="444" width="158" height="34" rx="17" fill="rgba(127,127,127,0.06)" stroke="#6f7b89" stroke-opacity="0.55" stroke-width="1.3"/>
      <text x="111" y="466" text-anchor="middle">deepseek · default</text>
      <rect x="202" y="444" width="236" height="34" rx="17" fill="rgba(127,127,127,0.06)" stroke="#6f7b89" stroke-opacity="0.55" stroke-width="1.3"/>
      <text x="320" y="466" text-anchor="middle">opencode · no API key</text>
      <rect x="450" y="444" width="196" height="34" rx="17" fill="rgba(127,127,127,0.06)" stroke="#6f7b89" stroke-opacity="0.55" stroke-width="1.3"/>
      <text x="548" y="466" text-anchor="middle">local · --fully-open</text>
      <text x="666" y="466" font-size="12">Switch with <tspan font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11">STARLING_LLM_PROFILE</tspan>, or write it once with <tspan font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11">starling init</tspan>.</text>
    </g>
  </g>
</svg>
